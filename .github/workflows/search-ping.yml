name: search-ping

# Submits the sitemaps to IndexNow (Bing/Yandex/Naver/Seznam) and re-submits
# them to Google Search Console.
#
# Run after article/research content is published to main. Cloudflare builds
# from the same push; the delay gives the live site time to publish its sitemap.
# GitHub's account billing lock can prevent the runner from starting until the
# repository owner resolves it (Frontier #3753).
on:
  push:
    branches:
      - main
    paths:
      - "src/_data/articles/**"
      - "src/research/**"
      - "src/*/research/**"
  workflow_dispatch:
  schedule:
    # Mondays 06:00 UTC.
    - cron: "0 6 * * 1"

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Wait for Cloudflare deploy
        run: sleep 180

      # IndexNow key is public by design (ownership = hosting /<key>.txt)
      - name: IndexNow (Bing, Yandex, Naver, Seznam)
        env:
          INDEXNOW_HOST: finopsllm.com
          INDEXNOW_KEY: 9f7a91c496064b7e96137c3326d9b895
          INDEXNOW_SITEMAP: https://finopsllm.com/sitemap-index.xml
        run: node scripts/indexnow-submit.mjs

      - name: Google Search Console sitemap resubmit
        env:
          GSC_SA_KEY: ${{ secrets.GSC_SA_KEY }}
          GSC_SITE: sc-domain:finopsllm.com
          GSC_SITEMAPS: https://finopsllm.com/sitemap-index.xml
        run: node scripts/gsc-sitemap-submit.mjs
