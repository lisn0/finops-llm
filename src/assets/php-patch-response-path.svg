<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc">
  <title id="title">PHP emergency response path</title>
  <desc id="desc">Inventory PHP services, prioritize internet-facing systems, apply the vendor patch, verify the running version, and record response costs. If immediate patching is not possible, apply a vendor-approved mitigation; if that is not feasible, take the affected system offline.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0 0L10 5L0 10z" fill="#7AAFFF"/></marker>
    <style>
      text{font-family:Inter,ui-sans-serif,system-ui,sans-serif;fill:#E6EAF2}
      .muted{fill:#B6C0D2}.step{fill:#101726;stroke:#385071;stroke-width:2}.urgent{fill:#172233;stroke:#E8895C;stroke-width:2}.line{stroke:#7AAFFF;stroke-width:3;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1200" height="460" rx="22" fill="#0A0F1A"/>
  <text x="56" y="54" font-size="16" font-weight="700" letter-spacing="2" fill="#7AAFFF">PHP SECURITY RESPONSE · 21 OCT 2026</text>
  <g font-size="21" font-weight="700" text-anchor="middle">
    <rect class="step" x="56" y="112" width="192" height="104" rx="14"/><text x="152" y="154">1 · INVENTORY</text><text class="muted" x="152" y="185" font-size="15" font-weight="400">Find every runtime + owner</text>
    <rect class="step" x="296" y="112" width="192" height="104" rx="14"/><text x="392" y="154">2 · PRIORITIZE</text><text class="muted" x="392" y="185" font-size="15" font-weight="400">Exposure + service impact</text>
    <rect class="step" x="536" y="112" width="192" height="104" rx="14"/><text x="632" y="154">3 · PATCH</text><text class="muted" x="632" y="185" font-size="15" font-weight="400">Use the vendor's fixed build</text>
    <rect class="step" x="776" y="112" width="192" height="104" rx="14"/><text x="872" y="154">4 · VERIFY</text><text class="muted" x="872" y="185" font-size="15" font-weight="400">Confirm production state</text>
    <rect class="step" x="1016" y="112" width="128" height="104" rx="14"/><text x="1080" y="154">5 · RECORD</text><text class="muted" x="1080" y="185" font-size="15" font-weight="400">Hours + impact</text>
  </g>
  <path class="line" d="M250 164h36M490 164h36M730 164h36M970 164h38"/>
  <path d="M632 226v52H393v20M632 278h239v20" stroke="#E8895C" stroke-width="2" fill="none"/>
  <text x="632" y="266" font-size="15" font-weight="600" text-anchor="middle" fill="#E8895C">IF PATCHING IS DELAYED</text>
  <g text-anchor="middle">
    <rect class="urgent" x="258" y="306" width="270" height="84" rx="14"/>
    <text x="393" y="342" font-size="18" font-weight="700">Apply an approved mitigation</text><text class="muted" x="393" y="369" font-size="14">Owner + expiry; keep moving to patch</text>
    <rect class="urgent" x="737" y="306" width="270" height="84" rx="14"/>
    <text x="872" y="342" font-size="18" font-weight="700">No safe mitigation available?</text><text class="muted" x="872" y="369" font-size="14">Take the affected system offline</text>
  </g>
  <text x="600" y="430" text-anchor="middle" font-size="13" class="muted">Follow the PHP team's and your platform vendor's current remediation instructions.</text>
</svg>
